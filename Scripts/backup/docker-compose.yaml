services:
  qwen35-opus-distilled:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen35-opus-distilled
    ports:
      - "8080:8080"
    environment:
      HF_REPO: "Jackrong/Qwen3.5-9B-Claude-4.6-Opus-Reasoning-Distilled-GGUF"
      HF_FILE: "Qwen3.5-9B.Q3_K_M.gguf"
      PORT: "8080"
      CTX_SIZE: "8192"
      THREADS: "12"
      BATCH_SIZE: "512"
      UBATCH_SIZE: "512"
      N_GPU_LAYERS: "0"
    volumes:
      - ./models:/models
      - ./start.sh:/app/start.sh
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: "http://qwen35-opus-distilled:8080/v1"
      OPENAI_API_KEY: "dummy"
    depends_on:
      - qwen35-opus-distilled
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
